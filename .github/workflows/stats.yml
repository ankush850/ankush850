name: Generate Profile Stats

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day, like the snake workflow
  workflow_dispatch:         # manual run button
  push:
    branches:
      - main

permissions:
  contents: write            # built-in token only - no API keys / PATs needed

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate SVG cards (public data, GITHUB_TOKEN)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/generate_stats.py \
            --user ankush850 \
            --token "$GH_TOKEN" \
            --outdir dist

      - name: Commit generated SVGs to 'stats' branch
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit --heads origin stats >/dev/null 2>&1; then
            git fetch origin stats
            git checkout stats
            git reset --hard origin/stats
          else
            git checkout --orphan stats
          fi
          mkdir -p cards
          cp dist/*.svg cards/
          git add cards
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile stat cards"
            git push origin stats
          else
            echo "No changes to commit"
          fi
